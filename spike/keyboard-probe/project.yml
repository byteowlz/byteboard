# Source of truth for the probe Xcode project. Regenerate with `just probe-generate`.
name: KeyboardProbe
options:
  bundleIdPrefix: com.byteowlz
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    # From local.env / the environment (XcodeGen expands it); empty is fine for unsigned builds.
    DEVELOPMENT_TEAM: ${BB_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode requires YES on any extension and on the libraries it links, so this
    # is not overridable: moonshine-swift must be extension-safe to be linkable.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  MoonshineVoice:
    url: https://github.com/moonshine-ai/moonshine-swift
    revision: 45a14f9edf1f2a6913d3aff38c1fd4e72d5b7daa
  # Cross-repo by path: both repos sit side by side in ~/byteowlz. The kit's bundled
  # JS/WASM resources ride along but are never loaded; the keyboard offers no tools.
  PiDurableKit:
    path: ../../../oqto-mobile/apps/ios/Packages/PiDurableKit
targets:
  ByteBoardSpike:
    type: application
    platform: iOS
    sources:
      - path: ByteBoardSpike
      - path: Shared
    dependencies:
      - target: ByteBoardKeyboard
        embed: true
      - package: PiDurableKit
      - sdk: AVFoundation.framework
    entitlements:
      path: ByteBoardSpike/ByteBoardSpike.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.byteowlz.byteboard
    info:
      path: ByteBoardSpike/Info.plist
      properties:
        CFBundleDisplayName: byteboard probe
        NSMicrophoneUsageDescription: The probe measures whether a keyboard extension can capture audio.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byteowlz.byteboard.spike
        TARGETED_DEVICE_FAMILY: "1"
        # Injectable for manual signing (empty => automatic signing, unchanged).
        PROVISIONING_PROFILE_SPECIFIER: $(BB_APP_PROFILE)
  ByteBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ByteBoardKeyboard
        excludes:
          - Resources/**
      # Generated by bundle-just-bash.sh and gitignored; an explicit resource
      # entry so a .js file is not guessed at by the build phase rules.
      - path: ByteBoardKeyboard/Resources/just-bash-iife.js
        buildPhase: resources
      # The Oqto mascot at rest, from byteowlz/oqto-animation logo/octo_logo_new_icon_only_white.svg
      # (grey cap band cut out, trimmed); a template image so it takes the toolbar tint.
      - path: ByteBoardKeyboard/Resources/pi-icon@2x.png
        buildPhase: resources
      - path: ByteBoardKeyboard/Resources/pi-icon@3x.png
        buildPhase: resources
      - path: ByteBoardKeyboard/Resources/snippets.local.json
        buildPhase: resources
        optional: true
      # Compiled by bundle-dicts.sh and gitignored. A folder reference so every language
      # present is shipped without listing each file.
      - path: ByteBoardKeyboard/Resources/dicts
        type: folder
        buildPhase: resources
        optional: true
      - path: Shared
    dependencies:
      - package: MoonshineVoice
        product: MoonshineVoice
      - package: PiDurableKit
      - sdk: AVFoundation.framework
    entitlements:
      path: ByteBoardKeyboard/ByteBoardKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.byteowlz.byteboard
    info:
      path: ByteBoardKeyboard/Info.plist
      properties:
        CFBundleDisplayName: byteboard
        NSMicrophoneUsageDescription: The probe measures whether a keyboard extension can capture audio.
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byteowlz.byteboard.spike.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        # Injectable for manual signing (empty => automatic signing, unchanged).
        PROVISIONING_PROFILE_SPECIFIER: $(BB_EXT_PROFILE)
        # byteboard-core, built by build-core.sh. Device only; the simulator is not a target.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lbyteboard_core
schemes:
  ByteBoardSpike:
    build:
      targets:
        ByteBoardSpike: all
